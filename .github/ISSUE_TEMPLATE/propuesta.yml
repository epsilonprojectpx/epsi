name: Propuesta
description: Sugiere una mejora o una idea para la hermandad
title: "propuesta: "
labels: ["tipo: propuesta"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Web
        - Registro y automatización
        - Identidad y marca
        - Gobernanza y reglas
        - Otra
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: La idea
      description: Qué propones y qué problema resuelve.
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
    validations:
      required: false
  - type: checkboxes
    id: contribuir
    attributes:
      label: Participación
      options:
        - label: Quiero trabajar en esta propuesta
          required: false
