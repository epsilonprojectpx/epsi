name: ascensos

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registro
  cancel-in-progress: false

jobs:
  ascender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: calcular ascensos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/ascensos.mjs
      - name: guardar
        run: |
          git config user.name "epsi[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/miembros.json badges
          git diff --cached --quiet && exit 0
          git commit -m "ascensos: actualizar grados"
          git pull --rebase origin main
          git push origin HEAD:main
